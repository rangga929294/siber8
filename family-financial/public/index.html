<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pundi — Keuangan Keluarga</title>
  <meta name="description" content="Catat arus keluar masuk keuangan keluarga dan pantau aset dalam satu tempat yang tenang." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b2e24'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23c9a227' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />

  <!-- Font: Plus Jakarta Sans + Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />

  <!-- Chart.js (grafik) & Lucide (ikon) via CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <!-- ================= SIDEBAR (desktop) ================= -->
  <aside id="sidebar">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <a class="brand" href="#/dashboard">
      <span class="brand-badge">P</span>
      <span>
        <span class="brand-name">Pundi</span><br />
        <span class="brand-sub">Kas Keluarga</span>
      </span>
    </a>

    <nav class="side-nav">
      <a class="nav-link" data-nav="dashboard" href="#/dashboard">
        <i data-lucide="layout-dashboard" style="--ic:19px"></i>
        Dashboard
        <span class="nav-dot"></span>
      </a>
      <a class="nav-link" data-nav="transaksi" href="#/transaksi">
        <i data-lucide="arrow-left-right" style="--ic:19px"></i>
        Transaksi
        <span class="nav-dot"></span>
      </a>
      <a class="nav-link" data-nav="aset" href="#/aset">
        <i data-lucide="gem" style="--ic:19px"></i>
        Aset
        <span class="nav-dot"></span>
      </a>
      <a class="nav-link" data-nav="laporan" href="#/laporan">
        <i data-lucide="chart-pie" style="--ic:19px"></i>
        Laporan
        <span class="nav-dot"></span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="fam-card">
        <div class="fam-row">
          <span class="fam-avatar">KW</span>
          <span>
            <span class="fam-name">Keluarga Wijaya</span><br />
            <span class="fam-sub">4 anggota · Jakarta</span>
          </span>
        </div>
        <p class="fam-quote">&ldquo;Sedikit demi sedikit, lama-lama menjadi bukit.&rdquo;</p>
      </div>
    </div>
  </aside>

  <!-- ================= KONTEN UTAMA ================= -->
  <main>
    <div id="app"></div>
  </main>

  <!-- ================= NAV BAWAH (mobile) ================= -->
  <nav id="mnav">
    <a data-nav="dashboard" href="#/dashboard">
      <i data-lucide="layout-dashboard" style="--ic:20px"></i>
      <span>Dashboard</span>
    </a>
    <a data-nav="transaksi" href="#/transaksi">
      <i data-lucide="arrow-left-right" style="--ic:20px"></i>
      <span>Transaksi</span>
    </a>
    <a data-nav="aset" href="#/aset">
      <i data-lucide="gem" style="--ic:20px"></i>
      <span>Aset</span>
    </a>
    <a data-nav="laporan" href="#/laporan">
      <i data-lucide="chart-pie" style="--ic:20px"></i>
      <span>Laporan</span>
    </a>
  </nav>

  <!-- overlay (form & konfirmasi) + toast -->
  <div id="overlay"></div>
  <div id="toasts"></div>
</body>
</html>
